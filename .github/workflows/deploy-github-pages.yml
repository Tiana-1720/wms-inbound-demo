name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES_BASE: /${{ github.event.repository.name }}/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front-prototype/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile annotation bundle
        run: |
          python "prd-docs/01-加盟商揽收仓需求/vitamin-prototype-annotation/scripts/compile_annotations.py" \
            "prd-docs/01-加盟商揽收仓需求/vitamin-prototype-annotation/annotation.workspace.json"
          cp "prd-docs/01-加盟商揽收仓需求/vitamin-prototype-annotation/output/annotation.bundle.json" \
            "front-prototype/public/annotation-kit/annotation.bundle.json"

      - name: Install and build
        working-directory: front-prototype
        run: |
          npm ci
          npm run build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: front-prototype/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
